# Makes the farm-box download every time something is merged into main, and attaches it to the
# "selfhost-latest" release (Releases, right side of the repository page). The farm box fetches it
# with ./mycol.sh update. The repository is private, so the download is private too.
# See docs/SELF-HOST.md.
name: Farm box download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selfhost
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:selfhost
      - name: Attach to the selfhost-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view selfhost-latest >/dev/null 2>&1 || \
            gh release create selfhost-latest --prerelease --title "Farm box (newest)" \
              --notes "Self-host download for the farm box. Replaced on every merge. Install: docs/SELF-HOST.md."
          gh release upload selfhost-latest dist-selfhost/mycol-selfhost.tar.gz --clobber
          gh release edit selfhost-latest --notes "Self-host download for the farm box, built $(cat dist-selfhost/mycol-selfhost/VERSION). Replaced on every merge. Install: docs/SELF-HOST.md."
